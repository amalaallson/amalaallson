<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Amala Allson - embedded systems laboratory boot screen</title>
  <desc id="d">Terminal-style banner with a microcontroller and PCB traces. Text: Amala Allson, building intelligence at the hardware level.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono','Courier New',monospace; }
      .t { fill: none; stroke: #00E5FF; stroke-opacity: .6; stroke-width: 2; stroke-linejoin: round;
           stroke-dasharray: 8 10; animation: flow 2.4s linear infinite; }
      .v { stroke: #8B5CF6; }
      .g { stroke: #00D68F; }
      .pad { fill: #080D16; stroke: #00E5FF; stroke-width: 2; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .led { animation: pulse 1.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .t, .cursor, .led { animation: none; } }
    </style>
  </defs>

  <!-- board -->
  <rect width="1200" height="400" fill="#080D16"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="10" fill="none" stroke="#00E5FF" stroke-opacity="0.25"/>

  <!-- terminal title bar -->
  <rect x="1" y="1" width="1198" height="36" rx="10" fill="#0D1624"/>
  <rect x="1" y="20" width="1198" height="17" fill="#0D1624"/>
  <circle cx="26" cy="19" r="5" fill="#00E5FF"/>
  <circle cx="46" cy="19" r="5" fill="#8B5CF6"/>
  <circle cx="66" cy="19" r="5" fill="#00D68F"/>
  <text x="92" y="24" class="m" font-size="13" fill="#94A3B8" letter-spacing="1">amala@lab:~$ boot --hardware --firmware</text>

  <!-- boot log -->
  <g class="m" font-size="14">
    <text x="50" y="84"><tspan fill="#00D68F">[ OK ]</tspan><tspan fill="#94A3B8"> CLOCK TREE INITIALISED</tspan></text>
    <text x="50" y="108"><tspan fill="#00D68F">[ OK ]</tspan><tspan fill="#94A3B8"> PERIPHERALS: GPIO · ADC · PWM · I2C · UART</tspan></text>
    <text x="50" y="132"><tspan fill="#00D68F">[ OK ]</tspan><tspan fill="#94A3B8"> FIRMWARE LINKED // READY</tspan></text>
  </g>

  <!-- title block -->
  <text x="50" y="216" class="m" font-size="78" font-weight="700" fill="#E6EDF3" letter-spacing="4" filter="url(#glow)">AMALA ALLSON</text>
  <rect x="52" y="232" width="140" height="4" fill="#00E5FF"/>
  <rect x="198" y="232" width="44" height="4" fill="#8B5CF6"/>
  <text x="50" y="278" class="m" font-size="21" fill="#00E5FF" letter-spacing="1.5">BUILDING INTELLIGENCE AT THE HARDWARE LEVEL.</text>
  <rect class="cursor" x="690" y="260" width="12" height="22" fill="#00E5FF"/>
  <text x="50" y="318" class="m" font-size="14" fill="#94A3B8" letter-spacing="0.5">ECE STUDENT  |  EMBEDDED SYSTEMS  |  HARDWARE &amp; FIRMWARE</text>

  <!-- status indicator -->
  <circle class="led" cx="58" cy="360" r="6" fill="#00D68F" filter="url(#glow)"/>
  <text x="76" y="365" class="m" font-size="14" fill="#00D68F" letter-spacing="1">STATUS: ONLINE<tspan fill="#94A3B8">  // BUILDING · TESTING · DEBUGGING</tspan></text>

  <!-- PCB traces: left -->
  <path class="t" d="M882 150 H850 L830 170 H790"/>
  <path class="t v" d="M882 190 H810"/>
  <path class="t g" d="M882 230 H850 L830 250 H780"/>
  <path class="t" d="M882 270 H860 L840 290 V330"/>
  <!-- right -->
  <path class="t" d="M1098 150 H1130 L1150 130 H1180"/>
  <path class="t v" d="M1098 190 H1170"/>
  <path class="t g" d="M1098 230 H1130 L1150 250 H1180"/>
  <path class="t" d="M1098 270 H1140 L1160 290 V330"/>
  <!-- top -->
  <path class="t" d="M940 92 V70 H900 V50"/>
  <path class="t g" d="M980 92 V55"/>
  <path class="t v" d="M1020 92 V70 H1050 V50"/>
  <path class="t" d="M1060 92 V70 L1080 50 H1110"/>
  <!-- bottom -->
  <path class="t" d="M940 308 V330 H920 V350"/>
  <path class="t v" d="M980 308 V345"/>
  <path class="t g" d="M1020 308 V330 H1040 V350"/>
  <path class="t" d="M1060 308 V335 L1080 355 H1100"/>

  <!-- pads -->
  <g class="pad">
    <circle cx="790" cy="170" r="5"/><circle cx="810" cy="190" r="5"/><circle cx="780" cy="250" r="5"/><circle cx="840" cy="330" r="5"/>
    <circle cx="1180" cy="130" r="5"/><circle cx="1170" cy="190" r="5"/><circle cx="1180" cy="250" r="5"/><circle cx="1160" cy="330" r="5"/>
    <circle cx="900" cy="50" r="5"/><circle cx="980" cy="55" r="5"/><circle cx="1050" cy="50" r="5"/><circle cx="1110" cy="50" r="5"/>
    <circle cx="920" cy="350" r="5"/><circle cx="980" cy="345" r="5"/><circle cx="1040" cy="350" r="5"/><circle cx="1100" cy="355" r="5"/>
  </g>

  <!-- microcontroller -->
  <g>
    <g stroke="#00E5FF" stroke-width="4" stroke-linecap="butt">
      <path d="M920 110V92M940 110V92M960 110V92M980 110V92M1000 110V92M1020 110V92M1040 110V92M1060 110V92"/>
      <path d="M920 290V308M940 290V308M960 290V308M980 290V308M1000 290V308M1020 290V308M1040 290V308M1060 290V308"/>
      <path d="M900 130H882M900 150H882M900 170H882M900 190H882M900 210H882M900 230H882M900 250H882M900 270H882"/>
      <path d="M1080 130H1098M1080 150H1098M1080 170H1098M1080 190H1098M1080 210H1098M1080 230H1098M1080 250H1098M1080 270H1098"/>
    </g>
    <rect x="900" y="110" width="180" height="180" rx="8" fill="#0D1624" stroke="#00E5FF" stroke-width="2.5"/>
    <rect x="924" y="134" width="132" height="132" rx="4" fill="none" stroke="#8B5CF6" stroke-opacity="0.7" stroke-dasharray="4 4"/>
    <circle cx="916" cy="126" r="4" fill="#00E5FF"/>
    <text x="990" y="198" class="m" font-size="34" font-weight="700" fill="#E6EDF3" text-anchor="middle" letter-spacing="3">MCU</text>
    <text x="990" y="224" class="m" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="1">GPIO · ADC · I2C · UART</text>
  </g>

  <text x="1180" y="388" class="m" font-size="11" fill="#94A3B8" fill-opacity="0.5" text-anchor="end" letter-spacing="2">AMALA_ALLSON_N // REV A</text>
</svg>
