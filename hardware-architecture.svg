<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
  <title id="t">Hardware ecosystem and system architecture</title>
  <desc id="d">A generic microcontroller interface map. GPIO with interrupts, PWM, and ADC/DAC on the left; I2C, I2S, one-wire GPIO and UART peripherals on the right; target platforms STM32 Blue Pill, ESP32 DevKit V1, PSoC 4100S Plus and ESP32-CAM below. Pin assignments are intentionally omitted.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .m { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono','Courier New',monospace; }
      .t { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 8 8; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) { .t { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#080D16"/>
  <rect width="1200" height="620" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="618" rx="10" fill="none" stroke="#00E5FF" stroke-opacity="0.25"/>

  <text x="50" y="50" class="m" font-size="20" font-weight="700" fill="#00E5FF" letter-spacing="2">HARDWARE ECOSYSTEM // SYSTEM ARCHITECTURE</text>
  <text x="50" y="76" class="m" font-size="13" fill="#94A3B8">Generic interface map. Pin assignments are project-specific and intentionally omitted.</text>

  <text x="50" y="150" class="m" font-size="13" fill="#94A3B8" letter-spacing="2">I/O + CONTROL</text>
  <text x="860" y="140" class="m" font-size="13" fill="#94A3B8" letter-spacing="2">BUSES + PERIPHERALS</text>

  <!-- traces left -->
  <path class="t" stroke="#00D68F" d="M340 215 H400 L415 230 H470"/>
  <path class="t" stroke="#00D68F" d="M340 310 H470"/>
  <path class="t" stroke="#8B5CF6" d="M340 405 H400 L415 390 H470"/>
  <!-- traces right -->
  <path class="t" stroke="#00E5FF" d="M730 215 H780 L800 195 H860"/>
  <path class="t" stroke="#00E5FF" d="M730 275 H860"/>
  <path class="t" stroke="#00D68F" d="M730 335 H780 L800 355 H860"/>
  <path class="t" stroke="#00E5FF" d="M730 395 H770 L810 435 H860"/>

  <!-- left blocks -->
  <g class="m">
    <rect x="50" y="175" width="290" height="80" rx="6" fill="#0D1624" stroke="#00D68F" stroke-width="1.5"/>
    <rect x="50" y="175" width="5" height="80" fill="#00D68F"/>
    <text x="72" y="209" font-size="22" font-weight="700" fill="#00D68F">GPIO + IRQ</text>
    <text x="72" y="234" font-size="14" fill="#94A3B8">LED · BUZZER · PUSH BUTTON</text>

    <rect x="50" y="270" width="290" height="80" rx="6" fill="#0D1624" stroke="#00D68F" stroke-width="1.5"/>
    <rect x="50" y="270" width="5" height="80" fill="#00D68F"/>
    <text x="72" y="304" font-size="22" font-weight="700" fill="#00D68F">PWM</text>
    <text x="72" y="329" font-size="14" fill="#94A3B8">OUTPUT CONTROL · LED INTENSITY</text>

    <rect x="50" y="365" width="290" height="80" rx="6" fill="#0D1624" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="50" y="365" width="5" height="80" fill="#8B5CF6"/>
    <text x="72" y="399" font-size="22" font-weight="700" fill="#8B5CF6">ADC / DAC</text>
    <text x="72" y="424" font-size="14" fill="#94A3B8">ANALOG IN / OUT</text>
  </g>

  <!-- right blocks -->
  <g class="m">
    <rect x="860" y="160" width="290" height="70" rx="6" fill="#0D1624" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="860" y="160" width="5" height="70" fill="#00E5FF"/>
    <text x="882" y="190" font-size="22" font-weight="700" fill="#00E5FF">I2C</text>
    <text x="882" y="214" font-size="14" fill="#94A3B8">MPU6050 · SSD1306 OLED</text>

    <rect x="860" y="240" width="290" height="70" rx="6" fill="#0D1624" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="860" y="240" width="5" height="70" fill="#00E5FF"/>
    <text x="882" y="270" font-size="22" font-weight="700" fill="#00E5FF">I2S</text>
    <text x="882" y="294" font-size="14" fill="#94A3B8">INMP441 MIC · ESP32 PROJECT</text>

    <rect x="860" y="320" width="290" height="70" rx="6" fill="#0D1624" stroke="#00D68F" stroke-width="1.5"/>
    <rect x="860" y="320" width="5" height="70" fill="#00D68F"/>
    <text x="882" y="350" font-size="22" font-weight="700" fill="#00D68F">1-WIRE (GPIO)</text>
    <text x="882" y="374" font-size="14" fill="#94A3B8">DHT11</text>

    <rect x="860" y="400" width="290" height="70" rx="6" fill="#0D1624" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="860" y="400" width="5" height="70" fill="#00E5FF"/>
    <text x="882" y="430" font-size="22" font-weight="700" fill="#00E5FF">UART</text>
    <text x="882" y="454" font-size="14" fill="#94A3B8">SERIAL MONITOR</text>
  </g>

  <!-- MCU -->
  <g class="m">
    <rect x="470" y="170" width="260" height="280" rx="10" fill="#0D1624" stroke="#00E5FF" stroke-width="2.5"/>
    <rect x="494" y="194" width="212" height="232" rx="5" fill="none" stroke="#8B5CF6" stroke-opacity="0.7" stroke-dasharray="5 5"/>
    <circle cx="486" cy="186" r="4" fill="#00E5FF"/>
    <g fill="#00E5FF">
      <rect x="462" y="225" width="8" height="10"/><rect x="462" y="305" width="8" height="10"/><rect x="462" y="385" width="8" height="10"/>
      <rect x="730" y="210" width="8" height="10"/><rect x="730" y="270" width="8" height="10"/><rect x="730" y="330" width="8" height="10"/><rect x="730" y="390" width="8" height="10"/>
    </g>
    <text x="600" y="274" font-size="42" font-weight="700" fill="#E6EDF3" text-anchor="middle" letter-spacing="4">MCU</text>
    <text x="600" y="318" font-size="14" fill="#94A3B8" text-anchor="middle">GPIO · TIMERS · IRQ</text>
    <text x="600" y="342" font-size="14" fill="#94A3B8" text-anchor="middle">ADC · DAC · PWM</text>
    <text x="600" y="366" font-size="14" fill="#94A3B8" text-anchor="middle">I2C · UART · I2S</text>
  </g>

  <!-- platforms -->
  <text x="50" y="500" class="m" font-size="13" fill="#94A3B8" letter-spacing="2">TARGET PLATFORMS</text>
  <g class="m">
    <rect x="50" y="514" width="255" height="80" rx="6" fill="#0D1624" stroke="#00E5FF" stroke-opacity="0.6"/>
    <text x="68" y="546" font-size="18" font-weight="700" fill="#E6EDF3">STM32 BLUE PILL</text>
    <text x="68" y="571" font-size="13" fill="#94A3B8">STM32F103C6T6A · CORTEX-M3</text>

    <rect x="345" y="514" width="255" height="80" rx="6" fill="#0D1624" stroke="#00E5FF" stroke-opacity="0.6"/>
    <text x="363" y="546" font-size="18" font-weight="700" fill="#E6EDF3">ESP32 DEVKIT V1</text>
    <text x="363" y="571" font-size="13" fill="#94A3B8">ESP32 · WI-FI + BLE</text>

    <rect x="640" y="514" width="255" height="80" rx="6" fill="#0D1624" stroke="#00E5FF" stroke-opacity="0.6"/>
    <text x="658" y="546" font-size="18" font-weight="700" fill="#E6EDF3">PSoC 4100S PLUS</text>
    <text x="658" y="571" font-size="13" fill="#94A3B8">INFINEON · CORTEX-M0+</text>

    <rect x="935" y="514" width="215" height="80" rx="6" fill="#0D1624" stroke="#8B5CF6" stroke-opacity="0.8" stroke-dasharray="6 5"/>
    <text x="953" y="546" font-size="18" font-weight="700" fill="#E6EDF3">ESP32-CAM</text>
    <text x="953" y="571" font-size="13" fill="#8B5CF6">EXPLORATION · PLANNED</text>
  </g>
</svg>
